<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Spin the Board | Top Flight 501</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="img/icon-192.png?v=2">
  <script>
    try { var s = JSON.parse(localStorage.getItem('tf501:settings') || '{}'); if (s.theme === 'light' || s.theme === 'dark') document.documentElement.setAttribute('data-theme', s.theme); } catch (e) {}
  </script>
  <link rel="stylesheet" href="styles.css?v=57">
  <style>
    body { max-width: 520px; margin: 0 auto; padding: 12px 16px 40px; }
    #spin-app .card { padding: 18px; }
    .back { color: var(--green); font-weight: 700; text-decoration: none; }
    .legend { display: grid; gap: 6px; margin: 12px 0 6px; font-size: .92rem; }
    .legend div { display: flex; align-items: center; gap: 10px; }
    .legend b { margin-left: auto; color: var(--teal); }
    .sw { width: 18px; height: 18px; border-radius: 5px; flex: none; }
    .sw.s1 { background: #C8102E; } .sw.s3 { background: #F6EB61; border: 1px solid #c9bb2a; } .sw.s2 { background: #F6EB61; border: 1px solid #c9bb2a; border-radius: 50%; } .sw.sb { background: radial-gradient(#C8102E 35%, #12B886 37%); border-radius: 50%; }
    .label { font-weight: 700; font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; }
    .names { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .small { font-size: .82rem; }
    .topbar { display: flex; justify-content: space-between; align-items: center; font-weight: 700; color: var(--teal); margin: 4px 0 10px; }
    .sb { display: flex; gap: 8px; margin-bottom: 10px; }
    .sb-p { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px 10px; display: flex; justify-content: space-between; align-items: center; font-weight: 600; color: var(--muted); }
    .sb-p b { font-size: 1.35rem; color: var(--ink); font-variant-numeric: tabular-nums; }
    .sb-p.on { border-color: var(--green); box-shadow: 0 0 0 2px color-mix(in srgb, var(--green) 35%, transparent); color: var(--ink); }
    .board-wrap { position: relative; width: min(100%, 420px); margin: 0 auto; aspect-ratio: 1; transition: opacity .25s, transform .25s; touch-action: manipulation; }
    .board-wrap.dim { opacity: .55; transform: scale(.82); margin-top: -26px; margin-bottom: -30px; }
    .board { width: 100%; height: 100%; display: block; cursor: crosshair; filter: drop-shadow(0 10px 22px rgba(0,0,0,.28)); -webkit-tap-highlight-color: transparent; user-select: none; }
    .board .lbl { fill: #fff; font: 800 15px Outfit, sans-serif; text-anchor: middle; dominant-baseline: central; letter-spacing: .02em; }
    .board .brand { fill: #fff; font: 900 21px Outfit, sans-serif; letter-spacing: .32em; text-anchor: middle; }
    .board .brand.sub { fill: #F5C518; font-size: 13px; font-weight: 800; letter-spacing: .28em; }
    #fly { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 50; overflow: visible; }
    .board-wrap.thunk .board { animation: thunk .22s ease-out; }
    @keyframes thunk { 30% { transform: translateY(3px) scale(.995); } }
    .board .wire { stroke: rgba(200,200,200,.55); stroke-width: .9; fill: none; }
    .pointer { position: absolute; left: 50%; top: -6px; width: 0; height: 0; transform: translateX(-50%); border: 9px solid transparent; border-top: 14px solid var(--green); display: none; }
    #panel { margin-top: 12px; }
    .panel { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
    .panel.center { text-align: center; }
    .panel h3 { margin: 4px 0 6px; color: var(--teal); }
    .tap-hint { font-size: 1.2rem; font-weight: 800; color: var(--teal); margin: 2px 0; animation: nudge 1.6s ease-in-out infinite; }
    @keyframes nudge { 50% { transform: translateY(-3px); } }
    .segc .seg-hl { fill: none; stroke: none; }
    #rot.picked .segc { opacity: .28; transition: opacity .3s; }
    #rot.picked .segc.hit { opacity: 1; } #rot.picked .segc.hit .seg-hl { stroke: #fff; stroke-width: 4; }
    .q-club { display: flex; align-items: center; gap: 10px; font-size: 1.3rem; color: var(--ink); margin-bottom: 8px; }
    .q-badge { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 50%; background: var(--c1); color: #fff; font-weight: 900; font-size: .85rem; box-shadow: inset 0 0 0 3px var(--c2); }
    .q-tag { display: inline-block; background: var(--teal); color: var(--card); font-weight: 800; font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; padding: 5px 12px; border-radius: 30px; }
    .q-match { margin: 10px 0 6px; padding: 10px 12px; border-radius: 14px; background: var(--soft); text-align: center; line-height: 1.3; color: var(--ink); }
    .q-season { display: block; font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
    .q-date { display: block; font-size: .85rem; color: var(--muted); }
    .q-ask { font-size: 1.1rem; margin: 10px 0; color: var(--ink); }
    .q-form { display: flex; gap: 8px; } .q-form .text { flex: 1; min-width: 0; }
    .sl { flex: 1; display: flex; align-items: center; gap: 8px; } .sl .text { width: 64px; text-align: center; font-size: 1.2rem; } .sl span { font-weight: 800; color: var(--muted); }
    .err { color: var(--red); font-size: .9rem; margin: 8px 0 0; }
    .res { font-size: 1.6rem; font-weight: 900; margin: 0 0 4px; } .res.ok { color: var(--green); } .res.bad { color: var(--muted); }
    .club-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 10px; }
    .club-b { border: 0; border-radius: 10px; padding: 10px 0; background: var(--c1); color: #fff; font-weight: 800; cursor: pointer; }
    .final { display: grid; gap: 6px; margin: 12px 0; } .final div { display: flex; justify-content: space-between; padding: 10px 14px; border-radius: 12px; background: var(--soft); font-weight: 600; }
    .row { display: flex; gap: 8px; } .row > * { flex: 1; text-align: center; text-decoration: none; }
    .center { text-align: center; }
  </style>
</head>
<body>
  <main id="spin-app"></main>
  <script type="module" src="js/spin.js?v=3"></script>
</body>
</html>
