  <style>
    :root { --bg:#F3F6F5;--card:#FFFFFF;--teal:#1E4B57;--muted:#5F7378;--ink:#15262B;--green:#12B886;--line:#DCE5E3;--mark-filter:none; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0C1719;--card:#132225;--teal:#7FC4D2;--muted:#94AAAE;--ink:#E8F1EF;--green:#2BD09E;--line:#24393D;--mark-filter:brightness(0) invert(.85) sepia(.3) hue-rotate(140deg); color-scheme: dark; } }
    :root[data-theme="dark"] { --bg:#0C1719;--card:#132225;--teal:#7FC4D2;--muted:#94AAAE;--ink:#E8F1EF;--green:#2BD09E;--line:#24393D;--mark-filter:brightness(0) invert(.85) sepia(.3) hue-rotate(140deg); color-scheme: dark; }
    html, body { margin: 0; background: var(--bg); }
    html.booting, html.booting body { background: #F3F6F5; }
    body { font-family: 'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif; }
/* splash: the logo sits exactly where Android's own start screen puts it, so the two blend.
   Always light, because Android's start screen can only be light. */
#splash { --bg:#F3F6F5;--card:#FFFFFF;--teal:#1E4B57;--muted:#5F7378;--ink:#15262B;--green:#12B886;--line:#DCE5E3;--mark-filter:none; color-scheme: light; }
#splash {
  position: fixed; inset: 0; z-index: 100;
  background: var(--bg);
  transition: opacity .45s ease, visibility .45s;
}
/* exit: the rings ripple outwards (like a dart hitting water), then the whole screen fades */
#splash.out { opacity: 0; visibility: hidden; transition: opacity .45s ease .42s, visibility .45s .42s; }
#splash.out .ring { animation: ring-exit .45s cubic-bezier(.4,0,.2,1) both; }
#splash.out .ring.r3 { animation-delay: 0s; } #splash.out .ring.r2 { animation-delay: .07s; } #splash.out .ring.r1 { animation-delay: .14s; }
@keyframes ring-exit { from { transform: none; opacity: 1; } to { transform: scale(1.45); opacity: 0; } }
.splash-board { position: absolute; left: 50%; top: 39%; width: 190px; height: 190px; transform: translate(-50%, -50%); display: grid; place-items: center; animation: lift .6s cubic-bezier(.2,.7,.2,1) .1s both; }
/* starts dead centre (where Android's launch screen leaves the logo), then glides up to sit a little higher */
@keyframes lift { from { transform: translate(-50%, calc(-50% + 11vh)); } to { transform: translate(-50%, -50%); } }
.ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--line); animation: ring-in .6s ease-out both; }
.ring.r1 { animation-delay: .35s; }
.ring.r2 { inset: 28px; border-color: color-mix(in srgb, var(--green) 45%, var(--line)); animation-delay: .25s; }
.ring.r3 { inset: 62px; background: color-mix(in srgb, var(--green) 14%, transparent); border-color: var(--green); animation-delay: .15s; }
@keyframes ring-in { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
/* first frame matches Android's own launch screen (logo in a white circle), then eases into ours */
.splash-disc { position: absolute; left: 50%; top: 50%; width: 233px; height: 233px; margin: -116.5px 0 0 -116.5px; border-radius: 50%; background: #FFFFFF; animation: disc-out .5s ease .15s both; }
@keyframes disc-out { from { opacity: 1; transform: none; } to { opacity: 0; transform: scale(.82); } }
.splash-markwrap { position: relative; display: block; line-height: 0; animation: settle .45s ease .1s both; }
@keyframes settle { from { transform: scale(1.28); } to { transform: none; } }
.splash-mark { position: relative; height: 116px; width: auto; filter: var(--mark-filter); animation: thunk .55s ease-out .45s both; transform-origin: 50% 95%; }
@keyframes thunk { 0% { transform: none; } 30% { transform: rotate(-5deg) scale(1.04); } 60% { transform: rotate(3deg); } 100% { transform: none; } }
.splash-text { position: absolute; left: 16px; right: 16px; top: calc(39% + 112px); text-align: center; max-width: 360px; margin: 0 auto; }
.splash-name { margin: 0; font-size: 2.1rem; font-weight: 800; color: var(--teal); letter-spacing: -.02em; animation: rise .5s ease .55s both; }
.splash-tag { margin: 2px 0 12px; font-size: .75rem; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); animation: rise .5s ease .65s both; }
.splash-line { margin: 0 auto; font-size: 1.1rem; font-weight: 600; color: var(--ink); text-wrap: balance; min-height: 2.9em; animation: rise .5s ease .8s both; }
@keyframes rise { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
.splash-dots { display: flex; justify-content: center; gap: 7px; margin-top: 12px; animation: rise .4s ease .9s both; }
.splash-dots span { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: dot 1s ease-in-out infinite; }
.splash-dots span:nth-child(2) { animation-delay: .15s; }
.splash-dots span:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 0%, 100% { transform: scale(.6); opacity: .4; } 50% { transform: scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .splash-disc { display: none; }
  .ring, .splash-board, .splash-mark, .splash-markwrap, .splash-name, .splash-tag, .splash-line, .splash-dots, .splash-dots span { animation: none !important; }
  #splash.out { transition: opacity .45s ease, visibility .45s; }
}
