<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Top Flight 501 | Premier League trivia darts</title>
  <meta name="description" content="Premier League trivia scored like darts. Start on 501, name scorers, assists, lineups and bookings from real matches, and race to zero.">
  <meta name="theme-color" content="#1E4B57">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">

<body>
  <div id="splash" role="status" aria-label="Loading Top Flight 501">
    <div class="splash-inner">
      <div class="splash-board" aria-hidden="true">
        <span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span>
        <img class="splash-mark" src="img/mark.png?v=6" alt="" width="98" height="160">
      </div>
      <h1 class="splash-name">Top Flight 501</h1>
      <p class="splash-tag">Football · Darts · Trivia</p>
      <p class="splash-line" id="splash-line">From 501 to zero, one answer at a time.</p>
      <div class="splash-dots" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
  </div>
  <script>
    (function () {
      var lines = [
        "From 501 to zero, one answer at a time.",
        "Name the scorer. Hit the board. Win the leg.",
        "Football brains. Darts nerves.",
        "Who set it up? Who got booked? Who\u2019s on the oche?",
        "Every correct answer is a treble twenty.",
        "Three darts. One match. Pure Premier League.",
        "Know your Haaland from your Halland? Don\u2019t worry, we do.",
        "Game on! Step up to the oche.",
        "Real matches, real scorers, real bragging rights.",
        "It\u2019s not a quiz. It\u2019s a checkout."
      ];
      document.getElementById('splash-line').textContent = lines[Math.floor(Math.random() * lines.length)];
      window.__splashStart = Date.now();
    })();
  </script>
  <header class="top">
    <button class="brand" data-act="home" aria-label="Top Flight 501 home">
      <img src="img/mark.png?v=6" alt="" width="30" height="49">
      <span>
        <span class="brand-name">Top Flight 501</span>
        <span class="brand-tag">Football · Darts · Trivia</span>
      </span>
    </button>
    <div class="top-actions">
      <button class="icon-btn" data-act="settings" aria-label="Settings" title="Settings">⚙️</button>
      <button class="icon-btn" data-act="rules" aria-label="How to play" title="How to play">?</button>
    </div>
  </header>

  <main id="app" aria-live="polite"><p class="loading">Loading…</p></main>
  <div id="modal" hidden></div>

  <footer class="foot">
    <p>Match data: official Premier League / FPL records, 2016/17 to 2025/26.</p>
    <p class="social">
      <a href="https://x.com/topflight501_" target="_blank" rel="noopener">X @topflight501_</a>
      <a href="https://www.instagram.com/topflight501_/" target="_blank" rel="noopener">Instagram @topflight501_</a>
    </p>
    <p><a href="https://buymeacoffee.com/TopFlight501" target="_blank" rel="noopener">☕ Buy me a coffee</a> · Feedback: <a href="mailto:topflight501@outlook.com">topflight501@outlook.com</a></p>
  </footer>

  <script type="module" src="js/app.js?v=6"></script>

</html>
