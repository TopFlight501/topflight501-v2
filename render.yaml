# Render Blueprint: a free static site, no server needed.
services:
  - type: web
    name: topflight501
    runtime: static
    buildCommand: echo "No build step"
    staticPublishPath: ./public
    headers:
      - path: /data/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /reminders/*
        name: Content-Type
        value: text/calendar; charset=utf-8
